name: ALMG release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Run checks
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test
          python -W error -m unittest discover -s test -p 'test_*.py'
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)([-+].*)?$/\1/p' pubspec.yaml)"
            tag="v$version-main.$GITHUB_RUN_NUMBER"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and package
        env:
          FLUTTER_MACOS_ARM64_ONLY: "true"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flutter build macos --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          app="ALMG - Automated Language Model Generator.app"
          [[ "$(lipo -archs "build/macos/Build/Products/Release/$app/Contents/MacOS/${app%.app}")" == arm64 ]]
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "build/macos/Build/Products/Release/$app/Contents/Info.plist")"
          if [[ "$bundle_version" != "$VERSION" ]]; then
            echo "Expected app version $VERSION, found $bundle_version." >&2
            exit 1
          fi
          mkdir -p release
          package_dir="$(mktemp -d "${RUNNER_TEMP}/almg-package.XXXXXXXX")"
          trap 'rm -rf -- "$package_dir"' EXIT
          mkdir "$package_dir/backend"
          ditto "build/macos/Build/Products/Release/$app" "$package_dir/$app"
          # Refresh the local signatures after Flutter assembles the release bundle.
          codesign --force --sign - "$package_dir/$app/Contents/Frameworks/App.framework"
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags "$package_dir/$app"
          codesign --verify --deep --strict "$package_dir/$app"
          cp README.md PROJECT_TASKS.md "$package_dir/"
          cp backend/chat_history.py backend/image_recipe.py backend/inference.py \
            backend/model_setup.py backend/register-macos-service.py backend/studio.py \
            backend/requirements.txt backend/start-backend.command "$package_dir/backend/"
          ditto -c -k "$package_dir" release/ALMG-macOS-arm64.zip
          cd release
          unzip -tq ALMG-macOS-arm64.zip
          ditto -x -k ALMG-macOS-arm64.zip "$package_dir/extracted"
          codesign --verify --deep --strict "$package_dir/extracted/$app"
          diff -qr "$package_dir/backend" "$package_dir/extracted/backend"
          shasum -a 256 ALMG-macOS-arm64.zip > ALMG-macOS-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: almg-macos
          path: |
            release/ALMG-macOS-arm64.zip
            release/ALMG-macOS-arm64.zip.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: almg-macos
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          checksum="$(cat ALMG-macOS-arm64.zip.sha256)"
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}[[:blank:]][[:blank:]]ALMG-macOS-arm64\.zip$ ]]; then
            echo "Expected a SHA-256 checksum for ALMG-macOS-arm64.zip." >&2
            exit 1
          fi
          sha256sum --check ALMG-macOS-arm64.zip.sha256
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            options=(--verify-tag)
          else
            options=(--target "$GITHUB_SHA" --prerelease)
          fi
          gh release create "$RELEASE_TAG" ALMG-macOS-arm64.zip ALMG-macOS-arm64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" "${options[@]}" --generate-notes \
            --title "ALMG $RELEASE_TAG"
