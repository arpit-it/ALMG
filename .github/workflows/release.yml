name: ALMG release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Run checks
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test
          python -W error -m unittest discover -s test -p 'test_*.py'
      - name: Build and package
        env:
          FLUTTER_MACOS_ARM64_ONLY: "true"
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          flutter build macos --release --build-name="$version" --build-number="$GITHUB_RUN_NUMBER"
          app="ALMG - Automated Language Model Generator.app"
          [[ "$(lipo -archs "build/macos/Build/Products/Release/$app/Contents/MacOS/${app%.app}")" == arm64 ]]
          mkdir -p release/package/backend
          ditto "build/macos/Build/Products/Release/$app" "release/package/$app"
          cp README.md PROJECT_TASKS.md release/package/
          cp backend/*.py backend/requirements.txt backend/start-backend.command release/package/backend/
          ditto -c -k release/package release/ALMG-macOS-arm64.zip
          cd release
          shasum -a 256 ALMG-macOS-arm64.zip > ALMG-macOS-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: almg-macos
          path: |
            release/ALMG-macOS-arm64.zip
            release/ALMG-macOS-arm64.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: almg-macos
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check ALMG-macOS-arm64.zip.sha256
          gh release create "$GITHUB_REF_NAME" ALMG-macOS-arm64.zip ALMG-macOS-arm64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "ALMG $GITHUB_REF_NAME"
