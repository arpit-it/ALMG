name: ALMG release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

# Serialize stable release requests while leaving regular CI runs independent.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'almg-stable-release' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.version.outputs.archive }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Run checks
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test
          python -W error -m unittest discover -s test -p 'test_*.py'
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)([-+].*)?$/\1/p' pubspec.yaml)"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              latest="$(git tag --list --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found {print; found=1}')"
              if [[ -n "$latest" ]]; then
                IFS=. read -r major minor patch <<< "${latest#v}"
                version="$major.$minor.$((10#$patch + 1))"
              fi
              tag="v$version"
            else
              tag="v$version-main.$GITHUB_RUN_NUMBER"
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=ALMG-$tag-macOS-arm64.zip" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and package
        env:
          FLUTTER_MACOS_ARM64_ONLY: "true"
          ARCHIVE: ${{ steps.version.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flutter build macos --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          app="ALMG - Automated Language Model Generator.app"
          [[ "$(lipo -archs "build/macos/Build/Products/Release/$app/Contents/MacOS/${app%.app}")" == arm64 ]]
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "build/macos/Build/Products/Release/$app/Contents/Info.plist")"
          if [[ "$bundle_version" != "$VERSION" ]]; then
            echo "Expected app version $VERSION, found $bundle_version." >&2
            exit 1
          fi
          mkdir -p release
          package_dir="$(mktemp -d "${RUNNER_TEMP}/almg-package.XXXXXXXX")"
          trap 'rm -rf -- "$package_dir"' EXIT
          mkdir "$package_dir/backend"
          ditto "build/macos/Build/Products/Release/$app" "$package_dir/$app"
          # Refresh the local signatures after Flutter assembles the release bundle.
          codesign --force --sign - "$package_dir/$app/Contents/Frameworks/App.framework"
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags "$package_dir/$app"
          codesign --verify --deep --strict "$package_dir/$app"
          cp README.md PROJECT_TASKS.md "$package_dir/"
          cp backend/decoder_trials.py backend/decoder_checkpoint.py backend/decoder_bundle.py backend/decoder_tokenizer.py backend/decoder_training.py backend/decoder_recipe.py backend/run_manifest.py backend/chat_history.py backend/training_resources.py backend/lora_validation.py backend/recipe_contracts.py backend/project_storage.py backend/image_recipe.py backend/inference.py \
            backend/loc_discovery.py backend/europe_pmc.py backend/wikidata_discovery.py backend/world_bank.py backend/federal_register.py backend/crossref_discovery.py backend/sec_discovery.py backend/website_access.py backend/wikipedia_reuse.py backend/model_setup.py backend/register-macos-service.py backend/studio.py \
            backend/requirements.txt backend/start-backend.command "$package_dir/backend/"
          ditto -c -k "$package_dir" release/"$ARCHIVE"
          cd release
          unzip -tq "$ARCHIVE"
          ditto -x -k "$ARCHIVE" "$package_dir/extracted"
          codesign --verify --deep --strict "$package_dir/extracted/$app"
          diff -qr "$package_dir/backend" "$package_dir/extracted/backend"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: almg-macos
          path: |
            release/${{ steps.version.outputs.archive }}
            release/${{ steps.version.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: almg-macos
      - name: Publish the GitHub release
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          checksum="$(cat "$ARCHIVE.sha256")"
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}"  $ARCHIVE"$ ]]; then
            echo "Expected a SHA-256 checksum for $ARCHIVE." >&2
            exit 1
          fi
          sha256sum --check "$ARCHIVE.sha256"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            options=(--verify-tag)
          else
            options=(--target "$GITHUB_SHA")
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              options+=(--prerelease)
            fi
          fi
          gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" "${options[@]}" --generate-notes \
            --title "ALMG $RELEASE_TAG"
