name: ALMG release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Run checks
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test
          python -W error -m unittest discover -s test -p 'test_*.py'
      - name: Resolve release version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)([-+].*)?$/\1/p' pubspec.yaml)"
            tag="v$version-main.$GITHUB_RUN_NUMBER"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and package
        if: github.event_name == 'push'
        env:
          FLUTTER_MACOS_ARM64_ONLY: "true"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flutter build macos --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          app="ALMG - Automated Language Model Generator.app"
          [[ "$(lipo -archs "build/macos/Build/Products/Release/$app/Contents/MacOS/${app%.app}")" == arm64 ]]
          mkdir -p release/package/backend
          ditto "build/macos/Build/Products/Release/$app" "release/package/$app"
          cp README.md PROJECT_TASKS.md release/package/
          cp backend/chat_history.py backend/image_recipe.py backend/inference.py \
            backend/model_setup.py backend/register-macos-service.py backend/studio.py \
            backend/requirements.txt backend/start-backend.command release/package/backend/
          ditto -c -k release/package release/ALMG-macOS-arm64.zip
          cd release
          shasum -a 256 ALMG-macOS-arm64.zip > ALMG-macOS-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: almg-macos
          path: |
            release/ALMG-macOS-arm64.zip
            release/ALMG-macOS-arm64.zip.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: almg-macos
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          sha256sum --check ALMG-macOS-arm64.zip.sha256
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            options=(--verify-tag)
          else
            options=(--target "$GITHUB_SHA" --prerelease)
          fi
          gh release create "$RELEASE_TAG" ALMG-macOS-arm64.zip ALMG-macOS-arm64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" "${options[@]}" --generate-notes \
            --title "ALMG $RELEASE_TAG"
